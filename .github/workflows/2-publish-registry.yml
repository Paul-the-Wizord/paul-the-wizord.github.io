name: 2. Publish Registry

on:
  workflow_run:
    workflows: ["1. Build and Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish registry metadata to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Build registry metadata
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Registry files are served from the repo root (GitHub user pages).
          # .nojekyll disables Jekyll so dotfiles like .well-known/ are served.
          touch .nojekyll

          # Service discovery document
          mkdir -p .well-known
          cat > .well-known/terraform.json <<'JSON'
          {"providers.v1": "/v1/providers/"}
          JSON

          # Provider metadata directory (served at /v1/providers/example/hello/)
          PROVIDER_DIR="v1/providers/example/hello"
          mkdir -p "$PROVIDER_DIR"

          # Read GPG public key (committed to this repo)
          PUBKEY_FILE="gpg/public-key.asc"
          if [ ! -f "$PUBKEY_FILE" ] || [ ! -s "$PUBKEY_FILE" ]; then
            echo "::error::gpg/public-key.asc is missing or empty. See docs/setup.md."
            exit 1
          fi
          FPR="$(gpg --show-keys --with-colons "$PUBKEY_FILE" | awk -F: '/^fpr:/ {print $10; exit}')"
          KEY_ID="${FPR: -16}"
          KEY_ID="$(echo "$KEY_ID" | tr 'a-f' 'A-F')"
          echo "GPG key_id: $KEY_ID"
          # ascii_armor with escaped newlines for JSON embedding
          ASCII_ARMOR="$(python3 -c "import json; print(json.dumps(open('$PUBKEY_FILE').read()))")"

          # Enumerate all releases (semver tags) in this repo
          RELEASES_JSON="$(mktemp)"
          gh release list --repo "$GITHUB_REPOSITORY" --json tagName > "$RELEASES_JSON"
          echo "Releases:"; cat "$RELEASES_JSON"

          # Build the "List Available Versions" index and per-version download JSON
          # Origin registry protocol uses extensionless paths: /versions and /download/:os/:arch
          VERSIONS_FILE="$PROVIDER_DIR/versions"
          VERSIONS_BLOCK=""
          PLATFORMS_BLOCK='{"os":"linux","arch":"amd64"}'

          while IFS= read -r TAG; do
            [ -z "$TAG" ] && continue
            VER="${TAG#v}"
            echo "Processing version $VER"

            ASSETS="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets')"
            ZIP_URL="$(echo "$ASSETS" | jq -r '.[] | select(.name | endswith("_linux_amd64.zip")) | .url')"
            SUMS_URL="$(echo "$ASSETS" | jq -r '.[] | select(.name=="SHA256SUMS") | .url')"
            SIG_URL="$(echo "$ASSETS" | jq -r '.[] | select(.name=="SHA256SUMS.sig") | .url')"
            ZIP_NAME="$(echo "$ASSETS" | jq -r '.[] | select(.name | endswith("_linux_amd64.zip")) | .name')"

            if [ -z "$ZIP_URL" ] || [ "$ZIP_URL" = "null" ]; then
              echo "::warning::No linux/amd64 zip asset for $TAG; skipping"
              continue
            fi

            # Fetch SHA256SUMS to extract the hash for this zip
            SUMS_CONTENT="$(gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "SHA256SUMS" --output - 2>/dev/null || true)"
            SHASUM="$(echo "$SUMS_CONTENT" | awk -v f="$ZIP_NAME" '$2==f {print $1}')"

            # Per-version download JSON
            VERSION_DIR="$PROVIDER_DIR/$VER/download/linux"
            mkdir -p "$VERSION_DIR"
            cat > "$VERSION_DIR/amd64" <<JSON
          {
            "protocols": ["6.0"],
            "os": "linux",
            "arch": "amd64",
            "filename": "$ZIP_NAME",
            "download_url": "$ZIP_URL",
            "shasums_url": "$SUMS_URL",
            "shasums_signature_url": "$SIG_URL",
            "shasum": "$SHASUM",
            "signing_keys": {
              "gpg_public_keys": [
                {
                  "key_id": "$KEY_ID",
                  "ascii_armor": $ASCII_ARMOR
                }
              ]
            }
          }
          JSON

            VERSIONS_BLOCK="${VERSIONS_BLOCK}{\"version\":\"$VER\",\"protocols\":[\"6.0\"],\"platforms\":[$PLATFORMS_BLOCK]},"
          done < <(jq -r '.[].tagName' "$RELEASES_JSON")

          # Strip trailing comma
          VERSIONS_BLOCK="${VERSIONS_BLOCK%,}"

          cat > "$VERSIONS_FILE" <<JSON
          {"versions":[$VERSIONS_BLOCK]}
          JSON

          echo "=== versions ==="
          cat "$VERSIONS_FILE"

      - name: Commit registry metadata
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .nojekyll .well-known/ v1/
          if git diff --cached --quiet; then
            echo "No registry changes to commit."
          else
            git commit -m "Publish registry metadata [skip ci]"
            git push
          fi
