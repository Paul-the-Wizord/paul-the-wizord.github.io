name: 3. Test

on:
  workflow_run:
    workflows: ["2. Publish Registry"]
    types: [completed]

permissions:
  contents: read

jobs:
  test:
    name: Run end-to-end terraform test
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Get latest release version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName -q '.[0].tagName')
          VERSION="${LATEST_TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Latest version: $VERSION"

      - name: Run test
        env:
          PROVIDER_VERSION: ${{ steps.version.outputs.version }}
        run: bash test/run-test.sh
